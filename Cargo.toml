[package]
name = "pmsim"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Porous media simulator"
homepage = "https://github.com/cpmech/pmsim"
repository = "https://github.com/cpmech/pmsim"
documentation = "https://docs.rs/pmsim"
readme = "README.md"
categories = ["mathematics", "science", "simulation"]
keywords = ["mechanics", "fem"]

[features]
intel_mkl = [
    "russell_lab/intel_mkl",
    "russell_nonlin/intel_mkl",
    "russell_ode/intel_mkl",
    "russell_pde/intel_mkl",
    "russell_sparse/intel_mkl",
    "russell_stat/intel_mkl",
    "russell_tensor/intel_mkl",
]
local_sparse = [
    "russell_nonlin/local_sparse",
    "russell_ode/local_sparse",
    "russell_pde/local_sparse",
    "russell_sparse/local_sparse",
]
cudss = [
    "russell_nonlin/cudss",
    "russell_ode/cudss",
    "russell_pde/cudss",
    "russell_sparse/cudss",
]

[dependencies]
plotpy = "1.23"
gemlab = "2.3"
russell_lab = "2.7"
russell_nonlin = "2.7"
russell_ode = "2.7"
russell_pde = "2.7"
russell_sparse = "2.7"
russell_stat = "2.7"
russell_tensor = "2.7"
tritet = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3"
uuid = { version = "1.23", features = ["v4"] }

[patch.crates-io]
russell_lab = { path = "../russell/russell_lab" }
russell_nonlin = { path = "../russell/russell_nonlin" }
russell_ode = { path = "../russell/russell_ode" }
russell_pde = { path = "../russell/russell_pde" }
russell_sparse = { path = "../russell/russell_sparse" }
russell_stat = { path = "../russell/russell_stat" }
russell_tensor = { path = "../russell/russell_tensor" }

[dev-dependencies]
serial_test = "3.5"
