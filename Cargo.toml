[package]
name = "pmsim"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Porous media simulator"
homepage = "https://github.com/cpmech/pmsim"
repository = "https://github.com/cpmech/pmsim"
documentation = "https://docs.rs/pmsim"
readme = "README.md"
categories = ["mathematics", "science", "simulation"]
keywords = ["mechanics", "fem"]

[dependencies]
plotpy = "1.22"
gemlab = { path = "../gemlab" }
russell_lab = { path = "../russell/russell_lab" }
russell_nonlin = { path = "../russell/russell_nonlin" }
russell_ode = { path = "../russell/russell_ode" }
russell_pde = { path = "../russell/russell_pde" }
russell_sparse = { path = "../russell/russell_sparse" }
russell_tensor = { path = "../russell/russell_tensor" }
tritet = { path = "../tritet" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3"
uuid = { version = "1.19", features = ["v4"] }

[dev-dependencies]
serial_test = "3.2"
